name: Cloudflare React app

on:
  push:
    branches: [main, master, codex/cloudflare-react-migration]
    paths: ['web/**', 'scripts/**', 'Dockerfile', 'compose.yaml', '.dockerignore', 'data/**', 'data_files/**', 'pages/**', 'utils/local_data.py', 'tests/test_web_export.py', '.github/workflows/cloudflare-web.yml']
  pull_request:
    paths: ['web/**', 'scripts/**', 'Dockerfile', 'compose.yaml', '.dockerignore', 'data/**', 'data_files/**', 'pages/**', 'utils/local_data.py', 'tests/test_web_export.py', '.github/workflows/cloudflare-web.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified build to the Cloudflare production environment
        type: boolean
        default: false
  workflow_run:
    workflows: [Refresh Oyez Parquet]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: cloudflare-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-web.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install build dependencies
        run: |
          python -m pip install -r scripts/requirements-web.txt
          npm ci --prefix web
      - name: Export static case and transcript release
        run: python scripts/export_web_data.py
      - name: Verify data preservation
        run: |
          python scripts/check_python.py
          python -m pytest tests/test_web_export.py -q
      - name: Test frontend calculations, search, and Worker API
        working-directory: web
        run: npm test
      - name: Build React app
        working-directory: web
        run: npm run build
      - name: Install Chromium and run desktop/mobile Playwright
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
      - name: Verify Cloudflare asset limits and package Worker
        run: |
          node scripts/check_web_release.mjs
          cd web
          npx wrangler deploy --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: supreme-scrutiny-cloudflare
          path: |
            web/dist
            web/worker
            web/wrangler.jsonc
          retention-days: 7
  docker:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and start the complete image
        run: |
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 180
      - name: Run desktop/mobile tests against the container
        run: docker compose --profile test run --build --rm e2e
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose --profile test down
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [verify, docker]
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix web
      - uses: actions/download-artifact@v4
        with:
          name: supreme-scrutiny-cloudflare
          path: web
      - name: Deploy the verified release
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
