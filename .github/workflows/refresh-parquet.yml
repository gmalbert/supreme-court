name: Refresh Oyez Parquet

on:
  schedule:
    # Sunday 9 PM EDT (UTC-4) / 8 PM EST (UTC-5) → Monday 01:00 UTC
    - cron: '0 1 * * 1'
  workflow_dispatch:   # allow manual runs from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated Parquet files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas pyarrow requests zstandard

      - name: Refresh Parquet files
        run: python scripts/refresh_parquet.py --terms 2

      - name: Commit updated Parquet files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cases_by_term.parquet data/case_detail.parquet
          # Only commit if something actually changed
          git diff --cached --quiet || git commit -m "chore: weekly Oyez Parquet refresh [skip ci]"
          git push
