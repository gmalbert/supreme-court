name: Train portable browser model
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-web.txt
      - run: python scripts/train_web_model.py
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-browser-model
          path: data/web_model.json
          retention-days: 30
